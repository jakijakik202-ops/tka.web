<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latihan TKA</title>
<style>
:root{--bg:#f4f5ff;--card:#fff;--tx:#1b1f2a;--mut:#6b7280;--pri:#6366f1;--ok:#16a34a;--bad:#dc2626;--bd:#e5e7f2;--okbg:#dcfce7;--badbg:#fee2e2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1120;--card:#1a1d33;--tx:#eef0ff;--mut:#9aa3c0;--pri:#818cf8;--bd:#2b3052;--okbg:#12361f;--badbg:#3d1818}}
:root[data-theme="dark"]{--bg:#0f1120;--card:#1a1d33;--tx:#eef0ff;--mut:#9aa3c0;--pri:#818cf8;--bd:#2b3052;--okbg:#12361f;--badbg:#3d1818}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;overflow-x:hidden}
#app{max-width:600px;margin:0 auto;padding:18px 16px 50px;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
@keyframes up{to{transform:translateY(-40px);opacity:0}}
h1{font-size:30px;margin:6px 0 2px;background:linear-gradient(90deg,#6366f1,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin:0 0 18px}
.hero{background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;border-radius:20px;padding:18px;margin-bottom:18px}
.hero h1{background:none;color:#fff;-webkit-text-fill-color:#fff}
.hero p{margin:0;opacity:.9}
.sc{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:18px;padding:18px;margin-bottom:12px;color:#fff;font:inherit;text-align:left;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.15);transition:transform .15s}
.sc:hover{transform:translateY(-3px) scale(1.01)}.sc:active{transform:scale(.98)}
.sc .e{font-size:38px}.sc b{font-size:19px;display:block}.sc small{opacity:.9}
.lv{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px;font:inherit;color:inherit;text-align:left;cursor:pointer;transition:.15s}
.lv:hover{transform:translateX(4px)}.lv .e{font-size:28px}.lv b{display:block}.lv small{color:var(--mut)}
.back{background:none;border:0;color:var(--pri);font:inherit;font-weight:600;cursor:pointer;padding:0;margin-bottom:10px}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.pill{background:var(--card);border:1.5px solid var(--bd);border-radius:99px;padding:5px 12px;font-weight:700;font-size:14px}
.timer{position:relative;width:56px;height:56px;display:grid;place-items:center}
.timer svg{position:absolute;inset:0}.timer b{font-size:16px;z-index:1}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#ec4899);transition:width .4s}
.q{font-size:20px;font-weight:700;margin:0 0 16px}
.opt{display:flex;gap:10px;align-items:center;width:100%;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px;font:inherit;color:inherit;text-align:left;cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--pri);transform:translateX(4px)}
.opt i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px}
.opt.ok{background:var(--okbg);border-color:var(--ok);animation:pop .4s}.opt.bad{background:var(--badbg);border-color:var(--bad);animation:shake .4s}
.opt:disabled{cursor:default}
.exp{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:14px 16px;margin:14px 0}
.exp h3{margin:0 0 8px;font-size:16px}
.st{display:flex;gap:10px;margin:8px 0;opacity:0;animation:in .4s forwards}
.st span{flex:none;background:var(--pri);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:13px;font-weight:700}
.btn{background:linear-gradient(90deg,#6366f1,#ec4899);color:#fff;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;width:100%;cursor:pointer;box-shadow:0 6px 16px rgba(99,102,241,.35)}
.btn.g{background:none;color:var(--pri);border:2px solid var(--pri);box-shadow:none;margin-top:10px}
.fl{position:fixed;font-weight:800;color:var(--ok);font-size:22px;pointer-events:none;animation:up .9s forwards}
.cf{position:fixed;top:-30px;font-size:24px;pointer-events:none;animation:fall 3s linear forwards}
.c{text-align:center}.big{font-size:60px;font-weight:800;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.grid div{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:10px}
.grid b{display:block;font-size:22px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const D = {
mat:{n:'Matematika',e:'📐',g:'linear-gradient(135deg,#6366f1,#8b5cf6)',q:[
['Jika f(x) = x + 2 dan g(x) = 3x, maka (f∘g)(2) = ...',['8','12','10','6'],0,'(f∘g) artinya f(g(x)), jadi kerjain g dulu.|g(2) = 3 · 2 = 6|f(6) = 6 + 2 = 8. Jawabannya 8. (Kalau 12, itu hasil (g∘f), urutannya kebalik.)'],
['Invers dari f(x) = x + 5 adalah f⁻¹(x) = ...',['x − 5','x + 5','5x','x/5'],0,'Tulis y = x + 5|Pindahin 5 ke seberang (jadi minus): x = y − 5|Ganti y jadi x: f⁻¹(x) = x − 5'],
['Kantong berisi 3 bola merah dan 2 bola biru. Peluang terambil bola biru = ...',['2/5','3/5','1/2','2/3'],0,'Hitung total bola: 3 + 2 = 5|Bola biru ada 2|Peluang = yang diinginkan / total = 2/5'],
['Jika f(x) = 2x + 1 dan g(x) = x² − 3, maka (g∘f)(x) = ...',['4x² + 4x − 2','2x² − 5','4x² − 2','4x² + 1'],0,'(g∘f)(x) = g(f(x)), jadi x di g diganti 2x + 1|g(2x + 1) = (2x + 1)² − 3|Jabarin: (2x + 1)² = 4x² + 4x + 1|Kurangi 3: 4x² + 4x − 2'],
['Invers dari f(x) = (2x + 1)/(x − 3) adalah ...',['(3x + 1)/(x − 2)','(x − 3)/(2x + 1)','(3x − 1)/(x + 2)','(x + 3)/(2x − 1)'],0,'Tulis y = (2x + 1)/(x − 3), lalu kali silang: y(x − 3) = 2x + 1|Buka kurung: xy − 3y = 2x + 1|Kumpulin x ke satu sisi: xy − 2x = 3y + 1|Faktorkan x: x(y − 2) = 3y + 1, jadi x = (3y + 1)/(y − 2)|Ganti y jadi x: f⁻¹(x) = (3x + 1)/(x − 2)'],
['Dua dadu dilempar bersamaan. Peluang jumlah mata dadu 8 adalah ...',['5/36','1/6','1/9','7/36'],0,'Ruang sampel: 6 × 6 = 36|Pasangan berjumlah 8: (2,6), (3,5), (4,4), (5,3), (6,2) = 5 pasang|Peluang = 5/36'],
['Diketahui f(x) = x + 2 dan (f∘g)(x) = 3x² + 5. Maka g(x) = ...',['3x² + 3','3x² + 7','3x² + 5','3x² − 3'],0,'(f∘g)(x) = f(g(x)) = g(x) + 2|Samakan: g(x) + 2 = 3x² + 5|Pindahin 2: g(x) = 3x² + 3'],
['Diketahui f(x) = 3x − 2 dan g(x) = x + 4. Maka (f∘g)⁻¹(x) = ...',['(x − 10)/3','(x + 10)/3','(x + 14)/3','3x − 10'],0,'Cari dulu (f∘g)(x) = f(x + 4) = 3(x + 4) − 2 = 3x + 10|Misal y = 3x + 10, maka 3x = y − 10, x = (y − 10)/3|Ganti y jadi x: (x − 10)/3'],
['Dari 5 pria dan 4 wanita dipilih 3 orang. Peluang terpilih 2 pria dan 1 wanita adalah ...',['10/21','5/14','8/21','2/7'],0,'Total cara pilih 3 dari 9: C(9,3) = 84|Cara pilih 2 pria dari 5: C(5,2) = 10. Cara pilih 1 wanita dari 4: C(4,1) = 4|Cara yang diinginkan: 10 × 4 = 40|Peluang = 40/84 = 10/21']
]},
ind:{n:'Bahasa Indonesia',e:'📖',g:'linear-gradient(135deg,#f43f5e,#fb923c)',q:[
['Antonim kata "optimis" adalah ...',['pesimis','realistis','antusias','ambisius'],0,'Optimis = yakin hal baik akan terjadi|Antonim = lawan kata, yaitu yakin hal buruk akan terjadi|Jawabannya pesimis'],
['Kata yang baku adalah ...',['risiko','resiko','riziko','risikoh'],0,'Kata ini serapan dari bahasa Belanda "risico"|Dalam KBBI, c diserap jadi k dan s tetap s|Bentuk bakunya: risiko'],
['Sinonim kata "gigih" adalah ...',['tekun','malas','ragu','santai'],0,'Gigih = tidak mudah menyerah dan terus berusaha|Cari kata yang maknanya mirip: tekun (rajin dan bersungguh-sungguh)'],
['Kalimat yang efektif adalah ...',['Siswa sedang belajar di kelas.','Para siswa-siswa sedang belajar di kelas.','Banyak para siswa belajar di kelas.','Semua siswa-siswa itu belajar di kelas.'],0,'Kalimat efektif = hemat kata tapi jelas|Cek pemborosan: "para" sudah berarti jamak, "siswa-siswa" juga jamak, jadi dobel (pleonasme)|Pilih yang tidak dobel: "Siswa sedang belajar di kelas."'],
['Kalimat "Suasana rapat itu memanas" menggunakan makna ...',['konotatif','denotatif','leksikal','harfiah'],0,'Denotatif = makna sebenarnya. Konotatif = makna kiasan|Suasana tidak benar-benar bersuhu panas|"Memanas" artinya tegang, jadi konotatif'],
['Paragraf yang kalimat utamanya di awal paragraf disebut ...',['deduktif','induktif','campuran','naratif'],0,'Ingat arah alurnya: deduktif = umum ke khusus|Kalimat utama (umum) di awal, lalu diikuti penjelasan|Kalau kalimat utama di akhir, namanya induktif'],
['Kalimat majemuk bertingkat terdapat pada ...',['Ia tidak masuk sekolah karena sakit.','Ibu memasak dan ayah membaca koran.','Adik bermain, kakak belajar.','Ani menyapu halaman.'],0,'Majemuk bertingkat = ada induk kalimat dan anak kalimat (tidak setara)|Cari konjungsi subordinatif seperti karena, jika, ketika|Opsi pertama punya "karena", sedangkan "dan" dan koma menghubungkan klausa setara, dan opsi terakhir kalimat tunggal'],
['Penulisan "di" yang benar terdapat pada kalimat ...',['Ayah tinggal di Surabaya.','Adik di marahi ibu.','Dia di jemput kakak.','Kami di antar ke sekolah.'],0,'Aturan 1: di + tempat = kata depan, ditulis terpisah|Aturan 2: di + kata kerja = awalan, disambung (dimarahi, dijemput, diantar)|Hanya "di Surabaya" yang menunjuk tempat'],
['Kalimat dengan tanda baca yang tepat adalah ...',['Ibu membeli apel, jeruk, dan mangga.','Ibu membeli, apel jeruk dan mangga.','Ibu, membeli apel jeruk, dan mangga.','Ibu membeli apel jeruk, dan, mangga.'],0,'Pemerincian (daftar) dipisah koma|Sebelum kata "dan" pada rincian terakhir juga dipasang koma|Koma tidak boleh memisahkan subjek dari predikat, jadi opsi lain salah letak koma']
]},
eng:{n:'Bahasa Inggris',e:'🌍',g:'linear-gradient(135deg,#06b6d4,#3b82f6)',q:[
['She ___ to school every day.',['goes','go','going','gone'],0,'"Every day" menandakan simple present (kebiasaan)|Subjek She = orang ketiga tunggal|Verb wajib ditambah s/es: goes'],
['Synonym of "huge" is ...',['enormous','tiny','narrow','quiet'],0,'Huge artinya sangat besar|Cari yang artinya sama: enormous|Tiny = kecil, narrow = sempit, quiet = tenang'],
['They ___ playing football now.',['are','is','am','be'],0,'"Now" menandakan present continuous: to be + V-ing|Subjek They = jamak|To be untuk They adalah are'],
['If I ___ rich, I would travel the world.',['were','am','will be','be'],0,'Ini pengandaian yang tidak nyata (conditional type 2)|Pola: If + past, would + verb|To be bentuk past untuk pengandaian dipakai "were" untuk semua subjek'],
['This novel ___ by a famous author in 2010.',['was written','wrote','has written','is writing'],0,'Novel itu DITULIS orang, jadi kalimat pasif: be + V3|"In 2010" = waktu lampau, jadi be-nya was|Hasilnya: was written'],
['I have lived here ___ 2015.',['since','for','in','during'],0,'Pola present perfect (have lived)|Since dipakai untuk titik awal waktu (2015)|For dipakai untuk lamanya, misal for five years'],
['By the time we arrived, the movie ___.',['had started','started','has started','was start'],0,'Ada dua kejadian lampau: kami tiba dan filmnya mulai|Yang terjadi lebih dulu memakai past perfect (had + V3)|Film mulai sebelum kami tiba, jadi: had started'],
['She suggested that he ___ a doctor.',['see','sees','saw','seeing'],0,'Setelah kata kerja seperti suggest/recommend + that, dipakai pola subjunctive|Bentuknya: subjek + verb dasar (tanpa s/es, tanpa past)|Jadi: he see a doctor'],
['Hardly ___ the room when the phone rang.',['had she entered','she entered','did she enter','she had entered'],0,'"Hardly" di awal kalimat memicu inversi (auxiliary di depan subjek)|Pola: Hardly + had + subjek + V3 + when|Hasilnya: Hardly had she entered the room when the phone rang']
]}};
const L=[{n:'Mudah',e:'🌱',t:40,c:'#22c55e',d:'Pemanasan santai'},{n:'Sedang',e:'⚡',t:60,c:'#f59e0b',d:'Mulai menantang'},{n:'Sulit',e:'🔥',t:90,c:'#ef4444',d:'Level jago, soal berlapis'},{n:'Campuran',e:'🎲',t:60,c:'#8b5cf6',d:'Semua level sekaligus'}];
const app=document.getElementById('app');let S=null,TM=null;
const best=()=>{try{return JSON.parse(localStorage.getItem('tka2')||'{}')}catch(e){return{}}};
const setBest=(k,v)=>{try{const b=best();if(!(b[k]>=v)){b[k]=v;localStorage.setItem('tka2',JSON.stringify(b))}}catch(e){}};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function home(){clearInterval(TM);const b=best();
app.innerHTML='<div class="hero"><h1>📚 Latihan TKA</h1><p>Jawab cepat, dapat poin, kumpulin combo 🔥</p></div><p class="sub">Pilih pelajaran:</p>'+
Object.keys(D).map(k=>'<button class="sc" style="background:'+D[k].g+'" onclick="levels(\''+k+'\')"><span class="e">'+D[k].e+'</span><span><b>'+D[k].n+'</b><small>'+Math.max(0,...L.map((l,i)=>b[k+i]||0))+' poin tertinggi</small></span></button>').join('')+
'<p class="sub" style="font-size:13px">Soal latihan buatan sendiri, bukan soal resmi TKA.</p>'}

function levels(k){const b=best();
app.innerHTML='<button class="back" onclick="home()">← Kembali</button><h1>'+D[k].e+' '+D[k].n+'</h1><p class="sub">Pilih tingkat kesulitan:</p>'+
L.map((l,i)=>'<button class="lv" style="border-color:'+l.c+'" onclick="start(\''+k+'\','+i+')"><span class="e">'+l.e+'</span><span><b>'+l.n+'</b><small>'+l.d+' · ⏱ '+l.t+' dtk/soal · '+(i<3?3:9)+' soal</small></span><span style="margin-left:auto" class="pill">🏆 '+(b[k+i]||0)+'</span></button>').join('')}

function start(k,l){const pool=l<3?D[k].q.slice(l*3,l*3+3):D[k].q;
S={k,l,qs:shuf(pool).map(q=>({q:q[0],o:shuf(q[1].map((t,i)=>({t,ok:i===q[2]}))),s:q[3].split('|')})),i:0,pts:0,ok:0,st:0,mx:0,ans:false,tot:L[l].t};show()}

function show(){const q=S.qs[S.i];S.ans=false;S.t0=Date.now();
app.innerHTML='<div class="hud"><span class="pill">⭐ <span id="pt">'+S.pts+'</span></span><div class="timer"><svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="24" fill="none" stroke="var(--bd)" stroke-width="5"/><circle id="rg" cx="28" cy="28" r="24" fill="none" stroke="var(--pri)" stroke-width="5" stroke-linecap="round" stroke-dasharray="151" transform="rotate(-90 28 28)"/></svg><b id="tn">'+S.tot+'</b></div><span class="pill">'+(S.st>=2?'🔥 x'+S.st:'Soal '+(S.i+1)+'/'+S.qs.length)+'</span></div>'+
'<div class="bar"><i style="width:'+S.i/S.qs.length*100+'%"></i></div><p class="q">'+q.q+'</p>'+
q.o.map((o,i)=>'<button class="opt" onclick="pick('+i+')"><i>'+'ABCD'[i]+'</i>'+o.t+'</button>').join('')+'<div id="fb"></div>';
clearInterval(TM);TM=setInterval(()=>{const left=Math.max(0,S.tot-(Date.now()-S.t0)/1000),r=document.getElementById('rg');if(!r)return;
r.style.strokeDashoffset=151*(1-left/S.tot);r.style.stroke=left/S.tot<.3?'var(--bad)':'var(--pri)';document.getElementById('tn').textContent=Math.ceil(left);if(left<=0)pick(-1)},100)}

function pick(i){if(S.ans)return;S.ans=true;clearInterval(TM);
const q=S.qs[S.i],left=Math.max(0,S.tot-(Date.now()-S.t0)/1000),good=i>=0&&q.o[i].ok,bs=document.querySelectorAll('.opt');
bs.forEach((b,j)=>{b.disabled=true;if(q.o[j].ok)b.classList.add('ok')});
let msg;
if(good){S.ok++;S.st++;S.mx=Math.max(S.mx,S.st);const p=10+Math.round(left/S.tot*10)+(S.st>=3?5:0);S.pts+=p;msg='✅ Mantap! +'+p+' poin';fly('+'+p)}
else{S.st=0;if(i>=0)bs[i].classList.add('bad');msg=i<0?'⏰ Waktu habis!':'❌ Belum pas, simak langkahnya ya'}
document.getElementById('pt').textContent=S.pts;
document.getElementById('fb').innerHTML='<div class="exp"><h3>'+msg+'</h3><b>Cara mengerjakan:</b>'+q.s.map((t,n)=>'<div class="st" style="animation-delay:'+n*.25+'s"><span>'+(n+1)+'</span><div>'+t+'</div></div>').join('')+'</div><button class="btn" onclick="nxt()">'+(S.i==S.qs.length-1?'Lihat hasil 🏁':'Lanjut →')+'</button>';
document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'})}

function fly(t){const e=document.createElement('div');e.className='fl';e.textContent=t;e.style.left='45%';e.style.top='25%';document.body.appendChild(e);setTimeout(()=>e.remove(),900)}
function nxt(){S.i++;S.i<S.qs.length?show():result()}

function result(){setBest(S.k+S.l,S.pts);const r=S.ok/S.qs.length,n=r>=.9?3:r>=.6?2:r>0?1:0;
app.innerHTML='<div class="c"><p class="sub" style="margin-top:24px">'+D[S.k].n+' · '+L[S.l].n+'</p><div style="font-size:44px">'+'⭐'.repeat(n)+'☆'.repeat(3-n)+'</div><div class="big">'+S.pts+'</div><p class="sub">poin</p><p class="q">'+(r>=.9?'Luar biasa! 🔥':r>=.6?'Keren, dikit lagi sempurna! 💪':'Gapapa, ulangi biar makin lancar 😄')+'</p></div>'+
'<div class="grid c"><div><b>'+S.ok+'/'+S.qs.length+'</b>benar</div><div><b>🔥 '+S.mx+'</b>combo</div><div><b>'+L[S.l].e+'</b>'+L[S.l].n+'</div></div>'+
'<button class="btn" onclick="start(\''+S.k+'\','+S.l+')">Main lagi</button><button class="btn g" onclick="levels(\''+S.k+'\')">Ganti level</button><button class="btn g" onclick="home()">Menu utama</button>';
if(r>=.6)for(let i=0;i<30;i++){const c=document.createElement('div');c.className='cf';c.textContent=['🎉','✨','⭐','🎊'][i%4];c.style.left=Math.random()*100+'%';c.style.animationDelay=Math.random()*1.2+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4500)}}
home();
</script>
</body>
</html>
